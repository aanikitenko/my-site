title: Арина Никитенко
role: Студентка
bio: |
  Меня зовут Арина Никитенко. Мне 18 лет. Учусь на физико-математическом факультете Российского университета дружбы народов (РУДН) на направлении "Математика и компьютерные науки". Студентка группы НКАбд-07-25.
  
  🎿 **Спортсменка:**
  Занимаюсь лыжными гонками и спортивным ориентированием. Многократный победитель чемпионатов области по лыжным гонкам, чемпионка области 2022, 2023, 2024 годов. В спортивном ориентировании — участница Чемпионата России, где заняла 7 место.
  
  📚 **Учёба:**
  Увлекаюсь математикой и программированием. Победитель региональной олимпиады по математике (2024).
  
  📖 **Интересы:**
  В свободное время читаю книги, занимаюсь спортом, изучаю новые технологии в области компьютерных наук.
